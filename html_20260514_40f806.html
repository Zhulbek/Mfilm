<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MaksimFilms — каталог фильмов с реальными постерами</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎬 MAKSIMFILMS</h1>
        <p>Каталог из 20 фильмов | поиск, фильтры, сортировка</p>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Поиск фильма...">
        </div>
        <div class="filters">
            <label>📅 Год от:</label>
            <input type="number" id="yearFrom" value="1900" style="width:80px">
            <label>до:</label>
            <input type="number" id="yearTo" value="2030" style="width:80px">
            <label>⭐ Рейтинг ≥</label>
            <input type="number" id="ratingMin" step="0.1" value="0" style="width:75px">
        </div>
        <div class="sort-buttons">
            <button id="sortYearBtn">📅 По году</button>
            <button id="sortRatingBtn">⭐ По рейтингу</button>
        </div>
    </div>

    <div class="movies-grid" id="moviesGrid"></div>
    <div class="pagination" id="pagination"></div>
    <footer>MaksimFilms — курсовая работа. Постеры из открытых источников + локальное изображение для "Побега из Шоушенка"</footer>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle"></h3>
            <span class="close-modal">&times;</span>
        </div>
        <div class="modal-body">
            <div class="modal-poster"><img id="modalPoster" alt="poster"></div>
            <div class="modal-details">
                <p><strong>📅 Год:</strong> <span id="modalYear"></span></p>
                <p><strong>⭐ Рейтинг:</strong> <span id="modalRating"></span></p>
                <p><strong>🎭 Жанр:</strong> <span id="modalGenre"></span></p>
                <p><strong>📖 Сюжет:</strong> <span id="modalPlot"></span></p>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
